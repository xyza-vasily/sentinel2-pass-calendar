name: Update Sentinel-2 pass calendar

on:
  schedule:
    - cron: "0 4 */10 * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install skyfield numpy requests

      - name: Debug - show all files
  run: |
      echo "Current directory:"
      pwd
      echo "All files in root:"
      ls -la
      echo "Looking for Python files:"
      find . -name "*.py" -type f
    
      - name: Regenerate calendar
        run: python generate_calendar.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
